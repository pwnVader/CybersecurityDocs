<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
  <defs>
    <linearGradient id="mauveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#74c7ec" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Cyber Terminal / Shield Concept -->
  <path d="M50 15 L80 30 L80 65 L50 85 L20 65 L20 30 Z" fill="#181825" stroke="url(#mauveGrad)" stroke-width="3" filter="url(#glow)" />
  <!-- Promt Symbol >_ -->
  <path d="M38 42 L48 50 L38 58" stroke="#cba6f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="52" y1="58" x2="64" y2="58" stroke="#74c7ec" stroke-width="4" stroke-linecap="round" />
</svg>
